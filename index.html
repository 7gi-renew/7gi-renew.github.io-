<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Term Note</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1f2328; --muted: #6a737d; --card: #fff; --line: #e1e4e8; --accent: #2f6feb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --card: #161b22; --line: #30363d; --accent: #58a6ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
           font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif; }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
    .row:last-child { border-bottom: 0; }
    .ok { color: #1a7f37; } .ng { color: #cf222e; }
    @media (prefers-color-scheme: dark) { .ok { color: #3fb950; } .ng { color: #f85149; } }
    button { width: 100%; padding: 12px; font-size: 1rem; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
  </style>
</head>
<body>
<main>
  <h1>Term Note</h1>
  <p class="sub">デプロイ確認用ページ（v0）</p>

  <div class="card">
    <div class="row"><span>ページ表示</span><span class="ok">OK</span></div>
    <div class="row"><span>端末</span><span id="device">-</span></div>
    <div class="row"><span>IndexedDB</span><span id="idb">確認中…</span></div>
    <div class="row"><span>カメラAPI</span><span id="cam">-</span></div>
  </div>

  <div class="card">
    <div class="row"><span>この端末での保存回数</span><span id="count">-</span></div>
    <div class="row"><span>最終保存</span><span id="last">-</span></div>
  </div>
  <button id="save">保存テスト（+1）</button>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  $('device').textContent = /iPhone|iPad|Android/i.test(navigator.userAgent) ? 'スマホ' : 'PC';
  $('cam').innerHTML = navigator.mediaDevices?.getUserMedia
    ? '<span class="ok">利用可</span>' : '<span class="ng">利用不可</span>';

  // IndexedDB に数値を1つ保存し、再読み込み後も残るか確認する
  let db;
  const req = indexedDB.open('term-note-test', 1);
  req.onupgradeneeded = () => req.result.createObjectStore('kv');
  req.onerror = () => { $('idb').innerHTML = '<span class="ng">利用不可</span>'; };
  req.onsuccess = () => {
    db = req.result;
    $('idb').innerHTML = '<span class="ok">利用可</span>';
    render();
  };

  function render() {
    const get = db.transaction('kv').objectStore('kv').get('state');
    get.onsuccess = () => {
      const s = get.result || { count: 0, last: null };
      $('count').textContent = s.count;
      $('last').textContent = s.last ? new Date(s.last).toLocaleString('ja-JP') : '-';
    };
  }

  $('save').onclick = () => {
    if (!db) return;
    const store = db.transaction('kv', 'readwrite').objectStore('kv');
    const get = store.get('state');
    get.onsuccess = () => {
      const s = get.result || { count: 0 };
      store.put({ count: s.count + 1, last: Date.now() }, 'state').onsuccess = render;
    };
  };
</script>
</body>
</html>
